---
- hosts: "{{ to_host_ip }}"
  remote_user: root

  tasks:
    - name: Update the System Packages
      apt:
        update_cache: yes

    - name: Create a Tomcat Group
      group:
        name: "{{ to_user }}"

    - name: Create a Tomcat User
      user:
        name: "{{ to_user }}"
        group: "{{ to_user }}"

    - name: Install JAVA
      apt:
        name: default-jdk
        update_cache: yes
        state: present

    - name: Create a Tomcat Directory
      file:
        path: /opt/tomcat
        owner: "{{ to_user }}"
        group: "{{ to_user }}"
        mode: 755
        recurse: yes

    - name: Create a temporary directory
      file:
        path: /tmp/tomcat_extract
        state: directory
        mode: '0755'
      
    - name: Extract archive to temporary location
      unarchive:
        src: apache-tomcat-9.0.83.zip
        dest: /tmp/tomcat_extract
      
    - name: Copy Tomcat files to final destination
      shell: cp -r /tmp/tomcat_extract/apache-tomcat-9.0.83/* /opt/tomcat/

    - name: Set proper permissions
      file:
        path: /opt/tomcat
        owner: "{{ to_user }}"
        group: "{{ to_user }}"
        mode: '0755'
        recurse: yes

    - name: Cleanup temporary directory
      file:
        path: /tmp/tomcat_extract
        state: absent

    - name: Change ownership of tomcat directory
      file:
        path: /opt/tomcat
        owner: "{{ to_user }}"
        group: "{{ to_user }}"
        mode: "u+rwx,g+rx,o=rx"
        recurse: yes
        state: directory

    - name: Install Tomcat systemd service via template
      template:
        src: tomcat.service.j2
        dest: /etc/systemd/system/tomcat.service
        mode: '0644'
      vars:
        service_user: "{{ to_user }}"
        service_group: "{{ to_user }}"

    - name: Start and Enable Tomcat on sever
      systemd:
        name: tomcat
        state: started
        enabled: true
        daemon_reload: true

    - name: Creates directory
      ansible.builtin.file:
        path: "/home/{{ to_user }}/.ssh"
        state: directory
        owner: "{{ to_user }}"
        group: "{{ to_user }}"
        mode: 0700

    # Touch .ssh/config if it does not exist,
    # Forces openstack snapshot to save information about tomcat user
    - name: ensure file exists
      copy:
        content: ""
        dest: "/home/{{ to_user }}/.ssh/config"
        force: false
        group: "{{ to_user }}"
        owner: "{{ to_user }}"
        mode: 0600
